name: Publish LootPilot 0.11.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-0.11.1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          $out = Join-Path $PWD "artifacts/LootPilot-0.11.1-win-x64"
          dotnet publish .\src\TarkovPriceOverlay\TarkovPriceOverlay.csproj -c Release -r win-x64 --self-contained true -o $out
          Copy-Item .\README.md "$out\README.md" -Force
          Copy-Item .\LICENSE "$out\LICENSE" -Force
          Copy-Item .\THIRD-PARTY-NOTICES.md "$out\THIRD-PARTY-NOTICES.md" -Force
          if (-not (Test-Path "$out\ocr-models\PP-OCRv6_det_small.onnx")) {
            throw "Bundled OCR models are missing."
          }
          Compress-Archive -Path "$out\*" -DestinationPath .\LootPilot-0.11.1-win-x64.zip -CompressionLevel Optimal
          (Get-FileHash .\LootPilot-0.11.1-win-x64.zip -Algorithm SHA256).Hash | Set-Content .\LootPilot-0.11.1-win-x64.sha256.txt
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          修复 GitHub 发布包缺少 Tesseract 时无法识别的问题。

          - Tesseract 现在是可选兼容通道。
          - 默认使用发布包内置的神经 OCR 模型。
          - 无需单独安装 Tesseract 或 .NET 8 Desktop Runtime。
          - 请完整解压压缩包后运行 LootPilot.exe。
          "@
          gh release create v0.11.1 .\LootPilot-0.11.1-win-x64.zip .\LootPilot-0.11.1-win-x64.sha256.txt --title "LootPilot 0.11.1" --notes $notes --latest --target main
